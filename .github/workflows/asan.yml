name: ASan UBSan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux / ASan UBSan
    if: ${{ github.repository == 'alloc-init/crypto3' }}
    runs-on: [self-hosted, Linux, X64, hetzner-public]
    container:
      image: ubuntu:26.04
    timeout-minutes: 360
    env:
      BUILD_DIR: build/asan-ubsan
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CTEST_TIMEOUT_SECONDS: 1800

    steps:
    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          ccache \
          cmake \
          git \
          libboost-all-dev \
          perl \
          zstd

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: ccache-${{ runner.os }}-${{ github.ref_name }}-

    - name: Configure compiler cache
      run: ccache --max-size="$CCACHE_MAXSIZE"

    - name: Configure
      shell: bash
      run: |
        cmake_args=(
          -S .
          -B "$BUILD_DIR"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_FLAGS="-Werror -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          -DCMAKE_BUILD_TYPE=Release
        )

        cmake "${cmake_args[@]}" -DBUILD_TESTS=ON

    - name: List tests
      run: ctest --test-dir "$BUILD_DIR" -N | tee "$BUILD_DIR/ctest-tests.txt"

    - name: Compile tests
      run: cmake --build "$BUILD_DIR" --target tests --parallel "$(( $(nproc) / 4 ))"

    - name: Run tests
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_init_order=1:strict_string_checks=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        ctest --test-dir "$BUILD_DIR" --output-on-failure --parallel "$(nproc)" --timeout "$CTEST_TIMEOUT_SECONDS" --output-junit "$BUILD_DIR/ctest-results.xml"

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-ci-asan-ubsan-test-results
        path: |
          ${{ env.BUILD_DIR }}/ctest-tests.txt
          ${{ env.BUILD_DIR }}/ctest-results.xml
          ${{ env.BUILD_DIR }}/Testing/
        if-no-files-found: ignore
